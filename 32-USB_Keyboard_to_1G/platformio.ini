[env:tec1g]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower

; ---------------------------------------------------------------------------
; Select ONE board:
; ---------------------------------------------------------------------------

; Raspberry Pi Pico
board = pico

; Raspberry Pi Pico W
; board = rpipicow

; Raspberry Pi Pico 2 W
; board = rpipico2w

; ---------------------------------------------------------------------------
; CPU clock
; ---------------------------------------------------------------------------

; IMPORTANT:
; Keep this project at 120 MHz for Pico, Pico W and Pico 2 W.
;
; The Pico 2 W normally runs at 150 MHz, but this project deliberately uses
; 120 MHz because Pico-PIO-USB requires a compatible system clock for correct
; USB timing. Do not change this to the Pico 2 W's normal 150 MHz default.

board_build.f_cpu = 120000000L

; ---------------------------------------------------------------------------
; Libraries
; ---------------------------------------------------------------------------

lib_deps =
    https://github.com/sekigon-gonnoc/Pico-PIO-USB.git

; ---------------------------------------------------------------------------
; Build flags
; ---------------------------------------------------------------------------

build_flags =
    -D USE_TINYUSB
    -D CFG_TUH_ENABLED=1
    -D CFG_TUH_RPI_PIO_USB=1

    ; PIO-USB host wiring:
    ;   GP0 = D+
    ;   GP1 = D-
    -D PIN_USB_HOST_DP=0

; ---------------------------------------------------------------------------
; Serial monitor
; ---------------------------------------------------------------------------

monitor_speed = 115200
