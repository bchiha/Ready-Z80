; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; ── CPU speed — CRITICAL for PIO-USB ─────────────────────────────────────────
board_build.f_cpu = 120000000L

; ── USB stack ─────────────────────────────────────────────────────────────────
; lib_deps =
;     https://github.com/adafruit/Adafruit_TinyUSB_Arduino.git
;     https://github.com/sekigon-gonnoc/Pico-PIO-USB.git

lib_deps = 
    https://github.com/sekigon-gonnoc/Pico-PIO-USB.git

; ── Tell TinyUSB to use PIO-USB as the host backend ──────────────────────────
build_flags =
    -D USE_TINYUSB
    -D CFG_TUH_ENABLED=1
    -D CFG_TUH_RPI_PIO_USB=1
    -D PIN_USB_HOST_DP=2
    -D SERIAL_CDC=1 ; Enable USB serial for debugging

; ── Serial monitor ────────────────────────────────────────────────────────────
monitor_speed = 115200


